<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Travel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🌍 Work Travel</h1>
    <p>Travail et voyage en Europe</p>
  </header>

  <main>

    <section class="search-box">
      <h2>🔎 Rechercher un emploi</h2>

      <input
        type="text"
        id="search"
        placeholder="Métier, pays ou ville..."
        oninput="searchJobs()"
      >
    </section>

    <section>
      <h2>💼 Offres d'emploi</h2>

      <div id="jobs"></div>
    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
