name: Build WorkWay Smart APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'index.html'
      - 'app.js'
      - 'style.css'
      - 'supabase-config.js'
      - 'manifest.webmanifest'
      - 'favicon.svg'
      - 'icons/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare complete web assets
        run: |
          mkdir -p www/icons
          cp index.html app.js style.css supabase-config.js favicon.svg manifest.webmanifest www/
          cp -R icons/. www/icons/
          test -s www/index.html
          test -s www/app.js
          test -s www/style.css
          test -s www/supabase-config.js
          test -s www/manifest.webmanifest
      - name: Verify Capacitor config
        run: test -f capacitor.config.json && test ! -f capacitor.config.ts
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkWay-Smart-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
